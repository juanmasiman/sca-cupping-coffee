<div style="font-family:'Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fbfaf7;padding:32px 16px;color:#16181c;">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #d9dad4;border-radius:4px;padding:32px;text-align:center;">
    <div style="font-size:30px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;">lento</div>
    <div style="font-size:13px;color:#565b63;margin-top:4px;">coffee, taken slowly.</div>
    <p style="font-size:17px;font-weight:700;margin:28px 0 8px;">Your sign-in code</p>
    <div style="display:inline-block;border:1px solid #d9dad4;border-radius:4px;padding:14px 22px;margin:8px 0 16px;font-family:'Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:0.2em;color:#1d4f73;">{{ .Token }}</div>
    <p style="font-size:13px;color:#565b63;margin:0 0 20px;">Type it into lento.cafe. It works for an hour.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#16181c;color:#fbfaf7;text-decoration:none;font-size:15px;font-weight:700;padding:14px 28px;border-radius:4px;">Sign in to lento</a>
    <p style="font-size:13px;color:#6a6f75;margin:24px 0 0;">Didn’t ask for this? You can ignore it.</p>
  </div>
</div>
