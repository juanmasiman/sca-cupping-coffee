<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
  <title>lento.cafe</title>
  <meta name="description" content="lento — coffee, taken slowly. Tools for people who cup, pull shots and brew.">

  <!-- A cupping bowl, drawn rather than an emoji, in the ink the rest of the
       site uses. The emoji favicon rendered in whatever palette the operating
       system felt like, which is one more place the front door was not this
       product. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4f73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 10h16a3 3 0 0 1 0 6h-1'/%3E%3Cpath d='M3 10v2a7 7 0 0 0 7 7h2a7 7 0 0 0 7-7v-2'/%3E%3Cpath d='M8 3v3M12 2v4M16 3v3'/%3E%3C/svg%3E">

  <!-- One design system for every page on lento.cafe, this one included. It
       carried its own copy of the palette — a fourth one, in the cream and
       copper the three apps had already moved away from — so the front door
       and the thing one tap behind it were visibly different products. The
       faces declare font-display: swap, so linking this costs no blocking
       paint on the page a first visit lands on. -->
  <link rel="preload" href="/shared/fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/shared/tokens.css">
  <!-- The sheet the account layer injects is built from the same
       components as the three apps, so this page links the same
       stylesheet rather than growing a fourth copy of a modal. -->
  <link rel="stylesheet" href="/shared/components.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding: var(--space-8) var(--space-5);
    }

    .wrap { width: 100%; max-width: 420px; text-align: center; }

    /* The wordmark was a copper gradient through background-clip: text, which
       the project's own notes flag as an anti-pattern and which no other
       surface here does. It is the ink, at the weight the app headers use. */
    .mark {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .tagline { margin-top: var(--space-2); color: var(--text-dim); }

    .cards {
      margin-top: var(--space-8);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      text-align: left;
    }

    .card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      min-height: 64px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--space-4);
      text-decoration: none;
      color: inherit;
      transition: background 0.18s var(--ease);
    }
    .card:active { background: var(--chrome-soft); }
    @media (hover: hover) {
      .card:hover { background: var(--chrome-soft); }
    }
    .card:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }

    /* Same treatment as the icon buttons inside the apps: chrome ink on the
       soft chrome fill. Not the data ink — that one means "a value somebody
       set", and a launcher icon is not a measurement. */
    .card-icon {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: var(--radius);
      background: var(--chrome-soft);
      color: var(--chrome);
      display: grid;
      place-items: center;
    }
    .card-text { min-width: 0; }
    .card-title { display: block; font-size: 16px; font-weight: 700; }
    .card-sub { display: block; font-size: 13px; color: var(--text-dim); margin-top: 1px; }
    .card-arrow { margin-left: auto; flex: none; color: var(--chrome); }

    /* Not opacity. Half-strength text on this ground measures under 4.5:1,
       and the project has already been caught doing that once with a
       disabled button — WCAG exempts an inactive control, and a row that is
       simply not built yet is not a control. Tertiary ink is measured and it
       passes, so the card says what it is in words instead. */
    .soon {
      background: none;
      border-style: dashed;
    }
    .soon .card-icon { background: none; color: var(--text-faint); }
    .soon .card-title { color: var(--text-dim); font-weight: 600; }
    .soon .card-sub { color: var(--text-faint); }

    /* The account is a row in the page, not an icon floating in the corner.

       It started as the cupping sheet's button, pinned top-right, because
       that is where that sheet puts it. But the cupping sheet has a header
       bar for it to belong to and this page has none, so here it was a
       44px glyph alone in a large empty margin, unlabelled, three hundred
       pixels from anything else — and a person who wanted to sign in
       reported that they could not tap it.

       Fixed position at the top edge is also the one place on a phone that
       is not reliably the page's: browser chrome, a notch, a translucent
       toolbar and an install prompt all live there, and all of them are
       outside anything this stylesheet can see. A row in normal flow is
       occluded by nothing, says in words what it does, and is 64px of
       target instead of 44. */
    .account-card {
      width: 100%;
      /* The instruments are 8px apart; this is 32px, the same interval the
         page already uses between the tagline and the cards and between
         the cards and the footer. At 16px it read as a fifth tool. */
      margin-top: var(--space-8);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    /* 24px, not 32. The account row added a group to the page and on a
       640px phone the extra eight pixels were the difference between a
       launcher that fits and one that scrolls — and a body centred with
       align-items clips the top of what overflows rather than letting you
       reach it. The footer is 12px of faint text; it can give up the
       eight. */
    footer { margin-top: var(--space-7); font-size: 12px; color: var(--text-faint); }

    /* ---------- what is yours ----------

       The shelf and the gear were two open sections on the page, and
       they worked, and they made the front door 2,700px long. The tools
       are why somebody opens this page and the vault is why they come
       back to it, and a page that scrolls past the second to reach the
       first has the wrong thing in hand. So they are two small buttons
       under the account — a tier below the instruments, on purpose: half
       the height, no icon tile, two to a row — and the lists live in
       sheets behind them. The launcher is one screen again.

       Inside those sheets the rows are stock, not doors: no border, no
       fill, no tile, a hairline between entries and the name carrying
       the row. Twelve more cards would have been a wall of identical
       rectangles either way round. */
    .vault {
      margin-top: var(--space-4);
      display: flex;
      gap: var(--space-3);
      text-align: left;
    }
    .vault-btn {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 52px;
      padding: var(--space-3) var(--space-4);
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }
    .vault-btn:active { background: var(--chrome-soft); }
    @media (hover: hover) {
      .vault-btn:hover { background: var(--chrome-soft); }
    }
    .vault-btn:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
    .vault-text { flex: 1; min-width: 0; }
    .vault-label,
    .vault-count { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vault-label { font-size: 14px; font-weight: 700; }
    .vault-count { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    .vault-go { flex: none; color: var(--chrome); }

    /* ---------- a row of stock, inside a sheet ----------

       The rows bleed into the sheet's own padding so the hover fill and
       the rules run the full width of it, while the text stays on the
       sheet's margin with everything else. */
    .stock-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: calc(100% + var(--space-6));
      margin: 0 calc(var(--space-3) * -1);
      min-height: 52px;
      padding: var(--space-3);
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }
    .stock-row:active { background: var(--chrome-soft); }
    @media (hover: hover) {
      .stock-row:hover { background: var(--chrome-soft); }
    }
    .stock-row:focus-visible { outline: 2px solid var(--data); outline-offset: -2px; }

    .stock-text { flex: 1; min-width: 0; }
    .stock-name,
    .stock-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stock-name { font-size: 15px; font-weight: 600; }
    .stock-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

    /* The marks are the instruments' own glyphs, the same tamper and the
       same dripper drawn on the cards above. "What do I brew this with"
       is answered by the thing itself rather than by two more words on
       every row — and on a list of twenty bags two words a row is forty
       words nobody reads. */
    .stock-marks { flex: none; display: flex; gap: var(--space-2); color: var(--chrome); }
    .stock-go { flex: none; color: var(--text-faint); }

    /* Adding is the last line of the list, not a button parked under it. */
    .stock-add .stock-name { color: var(--text-dim); }
    .stock-plus { flex: none; color: var(--text-faint); }

    /* ---------- a piece of gear, described ----------

       What the brewer does to the water, and what you last made with it.
       The sentence is the one fact about a brewer that does not go stale
       — see /shared/brewers.js — so it is worth a sheet; a grind setting
       read off a model name would not be. */
    .gear-flow { font-size: 15px; font-weight: 600; }
    .gear-note { font-size: 14px; line-height: 1.5; color: var(--text-dim); margin-top: var(--space-2); }
    .gear-can { display: flex; flex-direction: column; gap: var(--space-2); }
    .gear-can-row { display: flex; gap: var(--space-3); font-size: 14px; }
    .gear-can-label { flex: 0 0 96px; color: var(--text-faint); }
    .gear-can-value { flex: 1; min-width: 0; }
    .gear-last {
      display: flex;
      align-items: baseline;
      gap: var(--space-3);
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
    }
    .gear-ago { font-family: var(--sans); font-size: 12px; font-weight: 400; color: var(--text-faint); }
    /* The way out of a gear sheet is the one button on this site that is
       a link rather than a button, because it goes to another app. `.btn`
       never had to say this before, so it does not. */
    a.btn { text-decoration: none; }

    /* ---------- the two sheets ----------

       Everything a sheet here is made of comes from components.css, which
       is why this page links it. These two are the layout the bag sheet
       needs and nothing else: short answers two to a row, so a record
       with nine fields in it is not nine screens of scrolling. */
    .bag-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .bag-group { display: flex; flex-direction: column; gap: var(--space-3); }
    /* WCAG exempts an inactive control from contrast, and a grinder an app
       is currently set to is exactly that: the switch is stating a fact
       the app will rewrite on its next boot, and the line under it says
       so in words. */
    .switch input:disabled + .switch-track { opacity: 0.55; }

    /* Adding is the last line of the list, not a button parked under it. */
    .stock-add .stock-name { color: var(--text-dim); }
    .stock-plus { flex: none; color: var(--text-faint); }

    @media (prefers-reduced-motion: reduce) {
      .card, .stock-row { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="mark">lento</h1>
    <p class="tagline">coffee, taken slowly.</p>

    <!-- The icons are drawn in the apps' own language — 2px stroke, rounded
         caps, currentColor — rather than emoji, which arrive in whatever
         palette and weight the operating system decides. Each one is the
         instrument rather than a mood: a cupping bowl, a portafilter, a
         dripper, a roast curve. -->
    <div class="cards">
      <a class="card" href="/cupping/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10h16a3 3 0 0 1 0 6h-1"/>
            <path d="M3 10v2a7 7 0 0 0 7 7h2a7 7 0 0 0 7-7v-2"/>
            <path d="M8 3v3M12 2v4M16 3v3"/>
          </svg>
        </span>
        <span class="card-text">
          <span class="card-title">Cupping</span>
          <span class="card-sub">SCA scoresheet · solo or with your table</span>
        </span>
        <svg class="card-arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="card" href="/espresso/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <!-- A tamper. Two attempts at a portafilter both read as a
                 magnifying glass at 24px — a circle with anything coming
                 off it does, and shrinking the circle until it did not
                 left something that was no longer a basket. A tamper is a
                 simpler silhouette, it is espresso and nothing else, and
                 it is confusable with nothing else on this page. -->
            <path d="M12 3v6"/>
            <path d="M9.5 3h5"/>
            <rect x="5" y="9" width="14" height="3.4" rx="1.2"/>
            <path d="M6.5 16.5h11"/>
            <path d="M8 20h8"/>
          </svg>
        </span>
        <span class="card-text">
          <span class="card-title">Espresso dial-in</span>
          <span class="card-sub">dose, yield, time · and what changed</span>
        </span>
        <svg class="card-arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a class="card" href="/filter/">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5h16l-6 8h-4z"/>
            <!-- The drop hangs clear of the spout. Touching it, the two read
                 as one object and the whole glyph became a keyhole. -->
            <path d="M12 13v1.4"/>
            <path d="M12 22a2.1 2.1 0 0 1-2.1-2.1c0-1.25 2.1-3.15 2.1-3.15s2.1 1.9 2.1 3.15A2.1 2.1 0 0 1 12 22z"/>
          </svg>
        </span>
        <span class="card-text">
          <span class="card-title">Filter brew log</span>
          <span class="card-sub">coffee, water, time · and the pours</span>
        </span>
        <svg class="card-arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <div class="card soon">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 20h18"/>
            <path d="M3 17c4 0 5-9 9-9 3 0 4 4 8 4"/>
            <circle cx="12" cy="8" r="1.4" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="card-text">
          <span class="card-title">Roasting log</span>
          <span class="card-sub">not built yet</span>
        </span>
      </div>
    </div>

    <!-- Hidden until /shared/config.js says there is a project to sign in
         to: an account row on a deploy with no backend is a door to a room
         that does not exist. It sits below the instruments with a gap of
         its own, because it is not a fifth tool — it is who you are while
         you use the other four. -->
    <button type="button" id="btn-account" class="card account-card hidden">
      <span class="card-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M5 20c1.2-3.4 3.9-5 7-5s5.8 1.6 7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="card-text">
        <span class="card-title" id="account-name">Sign in</span>
        <span class="card-sub" id="account-note">Your log on every device</span>
      </span>
      <svg class="card-arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <!-- Everything below the account is a thing you own rather than a
         place to go, and both are shared: the shelf and the grinders live
         in /shared/, so this is not the dial-in's view of your coffees or
         the brew log's — it is the shelf. Each button stays out of the
         page entirely until it has something behind it. A front door that
         shows an empty vault to somebody who has never brewed is telling
         them about a thing they have not used. -->
    <div class="vault hidden" id="vault">
      <button type="button" class="vault-btn hidden" id="btn-shelf">
        <span class="vault-text">
          <span class="vault-label">Your coffees</span>
          <span class="vault-count" id="shelf-count"></span>
        </span>
        <svg class="vault-go" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="vault-btn hidden" id="btn-gear">
        <span class="vault-text">
          <span class="vault-label">Your gear</span>
          <span class="vault-count" id="gear-count"></span>
        </span>
        <svg class="vault-go" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <footer>lento.cafe</footer>
  </main>

  <div id="shelf-modal" class="modal hidden">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="shelf-title">
      <div class="sheet-head">
        <h3 id="shelf-title">Your coffees</h3>
        <button id="shelf-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="edit-body" id="shelf-list"></div>
    </div>
  </div>

  <div id="gear-modal" class="modal hidden">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="gear-title">
      <div class="sheet-head">
        <h3 id="gear-title">Your gear</h3>
        <button id="gear-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="edit-body" id="gear-list"></div>
    </div>
  </div>

  <!-- A brewer or a machine, described. It used to be a link straight
       into the instrument, which answered a question nobody had asked:
       tapping the dripper on your own shelf is asking what it is and what
       you last made with it, not asking to leave. The way out is still
       there, at the foot, where a way out belongs. -->
  <div id="gear-item-modal" class="modal hidden">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="gear-item-title">
      <div class="sheet-head">
        <h3 id="gear-item-title">&nbsp;</h3>
        <button id="gear-item-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="edit-body" id="gear-item-body"></div>
      <div class="sheet-actions">
        <a id="gear-item-go" class="btn btn-ghost" href="/filter/">Open the brew log</a>
      </div>
    </div>
  </div>

  <!-- The bag, and only the bag. What is written on a coffee is shared —
       name, roaster, roast, origin, variety, process, altitude, what it
       claims to taste like — and this sheet edits that record. What it
       does not touch is a target dose, a ratio or a grind, because those
       are the instrument's answers and 1:2 in 28 seconds and 1:16 in
       three minutes are not two values of one setting. So this is not a
       third copy of either app's coffee sheet: it is a smaller, different
       form over the fields the two of them already share. -->
  <div id="bag-modal" class="modal hidden">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="bag-title">
      <div class="sheet-head">
        <h3 id="bag-title">The bag</h3>
        <button id="bag-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="edit-body" id="bag-body"></div>
      <div class="sheet-destroy">
        <button id="bag-remove" class="btn-quiet-danger" type="button">Take off the shelf</button>
      </div>
      <div class="sheet-actions">
        <button id="bag-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- A grinder, and the two things about it that are nobody's tool's.

       Which tools you use it with is recorded in /shared/kit.js and is
       only ever added to by an app saving its own kit — so this is where
       it can come off. Whether you still own it is the same story: until
       now, nothing on the site could cross out a grinder you sold.

       Stepped or stepless is deliberately absent. Each app's own kit is
       the authority for that app, so changing it here would move the
       prefill and leave the advice where it was — a control with an
       invisible effect, which is worse than no control. -->
  <div id="grinder-modal" class="modal hidden">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="grinder-title">
      <div class="sheet-head">
        <h3 id="grinder-title">The grinder</h3>
        <button id="grinder-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="edit-body" id="grinder-body"></div>
      <div class="sheet-destroy">
        <button id="grinder-forget" class="btn-quiet-danger" type="button">I no longer own this</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

       to find out. -->
