<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe6">
  <title>lento.cafe</title>
  <meta name="description" content="lento — coffee, taken slowly. Tools for people who cup, roast, and care.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f5efe6;
      --bg-card: #fffdf8;
      --line: #e4d8c4;
      --text: #2b2117;
      --text-dim: #7a6a55;
      --text-faint: #ab9a81;
      --accent: #b5793a;
      --accent-deep: #8a5526;
      --accent-soft: rgba(181, 121, 58, 0.13);
      --spring: cubic-bezier(0.32, 1.4, 0.45, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 32px 22px;
    }
    .wrap { width: 100%; max-width: 420px; text-align: center; }
    .mark {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(120deg, #e8b06b, var(--accent) 55%, var(--accent-deep));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }
    .tagline { margin-top: 8px; color: var(--text-dim); font-size: 16px; }
    .cards { margin-top: 38px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s var(--spring), box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(95, 65, 25, 0.12); }
    .card:active { transform: scale(0.98); }
    .card-icon {
      width: 46px; height: 46px;
      flex: none;
      border-radius: 13px;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      font-size: 23px;
    }
    .card-title { font-size: 16.5px; font-weight: 700; }
    .card-sub { font-size: 13px; color: var(--text-faint); margin-top: 2px; }
    .card-arrow { margin-left: auto; color: var(--accent); flex: none; }
    .soon { opacity: 0.55; pointer-events: none; }
    footer { margin-top: 42px; font-size: 12.5px; color: var(--text-faint); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="mark">lento</h1>
    <p class="tagline">coffee, taken slowly.</p>

    <div class="cards">
      <a class="card" href="/cupping/">
        <span class="card-icon">☕️</span>
        <span>
          <span class="card-title">Cupping</span>
          <span class="card-sub" style="display:block">SCA scoresheet · solo or with your table</span>
        </span>
        <svg class="card-arrow" viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="card soon">
        <span class="card-icon">🔥</span>
        <span>
          <span class="card-title">Roasting log</span>
          <span class="card-sub" style="display:block">coming later</span>
        </span>
      </div>
    </div>

    <footer>lento.cafe</footer>
  </main>
</body>
</html>
