<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
  <title>Filter brew log — lento</title>
  <meta name="description" content="Keep the record of a pour-over: coffee, water, time, grind and the pour schedule, with what changed between one brew and the next.">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- The standard name; Chrome warns on every load that the Apple-prefixed
       one is deprecated. Both ship, because older iOS reads only the old one. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- One design system for every app on lento.cafe. DESIGN.md is the law;
       this is the part of it a browser can read. -->
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ THE BOARD — one coffee, its brews ============ -->
<section id="screen-board" class="screen active">
  <header class="board-header">
    <!-- The coffee is the thing you switch, so it is the button. A kitchen
         has one or two bags open; a shelf behind a menu costs a tap every
         morning and earns nothing. -->
    <button id="btn-coffee" class="coffee-btn" aria-haspopup="dialog">
      <span class="coffee-btn-text">
        <span class="coffee-name" id="coffee-name">No coffee yet</span>
        <span class="coffee-sub" id="coffee-sub">tap to add one</span>
      </span>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" aria-label="Settings">
      <!-- Sliders, not a cog: a circle with eight spokes at 21px is a sun,
           and this button is not the theme switch. -->
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="7" r="2.4" fill="var(--bg-raise)" stroke="currentColor" stroke-width="2"/>
        <circle cx="16" cy="12" r="2.4" fill="var(--bg-raise)" stroke="currentColor" stroke-width="2"/>
        <circle cx="8" cy="17" r="2.4" fill="var(--bg-raise)" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </header>

  <div class="board-scroll" id="board-scroll">
    <!-- The recipe you settled on, if you have settled on one. It is pinned
         because it is the answer the whole board exists to find. -->
    <div class="keeper hidden" id="keeper"></div>

    <!-- What to change now. A brew log is the answer to "what do I do
         next?", so it sits at the top of the board rather than as the last
         line of the newest brew card, under the numbers and the schedule
         and the taste pips. -->
    <div class="next-card hidden" id="next-card"></div>

    <!-- What you are aiming at. A brew is only quick or long against
         something, so the window is stated rather than assumed. -->
    <div class="target-card" id="target-card"></div>

    <div class="log-list" id="brews"></div>

    <div class="empty hidden" id="empty"></div>

    <div class="board-footpad"></div>
  </div>

  <div class="board-action">
    <button id="btn-log" class="btn btn-primary">Log a brew</button>
  </div>
</section>

<!-- ============ THE BREW SHEET ============ -->
<div id="brew-modal" class="modal hidden">
  <div class="modal-sheet sheet-tall" role="dialog" aria-modal="true" aria-labelledby="brew-title">
    <div class="sheet-head">
      <h3 id="brew-title">This brew</h3>
      <button id="brew-close" class="icon-btn" aria-label="Close without saving">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="sheet-scroll">
      <!-- The numbers. Everything computed on this screen comes from these
           and from the schedule below, and nothing else. -->
      <div class="num-row" id="num-row"></div>

      <!-- The pour schedule: the record that makes this a brew log and not
           a dial-in with different words. An espresso is one event; a
           pour-over is five, and which five is the thing you change. -->
      <div class="pour-block" id="pour-block">
        <span class="field-label" id="pour-label">The pours</span>
        <!-- Which number the water column wants. Without this line the
             field takes cumulative from half its readers and incremental
             from the other half, and the schedule means nothing. -->
        <span class="pour-hint">Water is the running total on the scale, the way a recipe is written — not the weight of each pour.</span>
        <div id="pours"></div>
      </div>

      <!-- Read out of the numbers above, never typed. Mono, because a
           reader will compare them to the last brew's. -->
      <div class="readout" id="readout"></div>

      <!-- Said before the numbers, because that is when you know it. The
           card compares it afterwards with what actually moved. -->
      <div class="intent-block">
        <span class="field-label" id="intent-label">What are you changing?</span>
        <div class="chips" id="intent" role="radiogroup" aria-labelledby="intent-label"></div>
      </div>

      <!-- Two walls, asked separately. Grind answers the first; the ratio
           answers the second. Asking them as one "how was it" is what
           makes brewing advice feel like guesswork. -->
      <div class="taste-block">
        <span class="field-label" id="taste-label">Sour or bitter?</span>
        <div id="taste-scale"></div>
        <span class="field-label" id="body-label">Thin or strong?</span>
        <div id="body-scale"></div>
      </div>

      <div class="verdict-block">
        <span class="field-label">Keep it?</span>
        <div class="verdict" id="verdict" role="radiogroup" aria-label="Keep it?"></div>
      </div>

      <details class="more" id="more">
        <summary>Notes and the rest</summary>
        <div class="more-body" id="more-body"></div>
      </details>
    </div>

    <div class="sheet-actions">
      <!-- Only on a brew that exists; there is nothing to remove from a
           sheet nobody has saved. -->
      <button id="brew-delete" class="btn btn-ghost btn-danger hidden">Remove this brew</button>
      <button id="brew-save" class="btn btn-primary">Save the brew</button>
    </div>
  </div>
</div>

<!-- ============ COFFEE SHEET ============ -->
<div id="coffee-modal" class="modal hidden">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="coffee-title">
    <div class="sheet-head">
      <h3 id="coffee-title">Coffees</h3>
      <button id="coffee-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="coffee-list" id="coffee-list"></div>
    <div class="sheet-actions">
      <button id="btn-add-coffee" class="btn btn-primary">Add a coffee</button>
    </div>
  </div>
</div>

<!-- ============ EDIT COFFEE / TARGET ============ -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="sheet-head">
      <h3 id="edit-title">The coffee</h3>
      <button id="edit-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="edit-body" id="edit-body"></div>
    <div class="sheet-actions">
      <button id="edit-delete" class="btn btn-ghost btn-danger">Remove this coffee</button>
      <button id="edit-save" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- ============ YOUR KIT ============ -->
<!-- Asked once, before the first brew. What the app needs is not the
     brewer's name — a brand table goes stale in a year and is wrong about
     every hybrid on the shelf — but what the kit can change, and whether
     the water passes through the bed or the coffee sits in it. -->
<div id="kit-modal" class="modal hidden">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="kit-title">
    <div class="sheet-head">
      <h3 id="kit-title">Your setup</h3>
      <button id="kit-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="kit-body" id="kit-body"></div>
    <div class="sheet-actions">
      <button id="kit-skip" class="btn btn-ghost">Skip</button>
      <button id="kit-save" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h3 id="settings-title">Settings</h3>
      <button id="settings-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="settings-body" id="settings-body"></div>
    <div class="sheet-actions">
      <button id="settings-done" class="btn btn-primary">Done</button>
    </div>
  </div>
</div>

<!-- ============ HELP ============ -->
<div id="help-modal" class="modal hidden">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="sheet-head">
      <h3 id="help-title">About</h3>
      <button id="help-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="help-body" id="help-body"></div>
    <div class="sheet-actions">
      <button id="help-done" class="btn btn-primary">Close</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
